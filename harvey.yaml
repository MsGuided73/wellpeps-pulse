# WellPeps Pulse configuration.
# Local overrides (real owner names, etc.) go in harvey.local.yaml, which is
# gitignored and wins over this file. Unknown keys are rejected on load.

organization:
  name: "WellPeps"
  market: "US"            # US telehealth; drives compliance rules in later phases

usage:
  # Leave the rest of the Claude subscription for humans: stop spending
  # once any quota window passes this percentage.
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  # While any escalation is open, wake at least this often so SLA breaches
  # are re-paged promptly.
  urgent_tick_minutes: 5
  # Which Claude model each agent uses (any `claude --model` value). Keys are
  # an agent or agent.task; the more specific one wins. Unlisted calls use
  # the CLI's default model.
  models:
    triager: haiku        # classification: a small model is plenty
    safety: haiku         # independent safety screen: one narrow yes/no question
    drafter: sonnet       # reply drafting from approved claims
    reviewer: sonnet      # adversarial compliance review; never haiku (config rejects it)
    pulse: sonnet         # daily/weekly market brief (aggregates only, never post text)
    slackbot.plan: haiku  # #pulse-query bot: question -> strict query spec (JSON)
    slackbot.answer: sonnet  # #pulse-query bot: short answer from the aggregate result only
  # Drafting and briefs pause in quiet hours. Escalations never do.
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/New_York"

triage:
  # Second, independent model call on health-related mentions that triage
  # did not escalate: catches adverse events / self-harm a prompt-injected
  # post might talk the triager out of. Costs one small call per such mention.
  safety_screen: true

escalation:
  # Who gets paged for adverse events and legal/regulatory mentions.
  # Must be named before launch (docs/PLAN.md §5).
  clinical_owner: ""      # owns adverse_event escalations
  backup_owner: ""        # also paged when an SLA is breached
  sla_minutes: 15         # acknowledge within this many minutes, or re-page
  # Owners for the other escalation kinds. A blank owner still pages, but the
  # Slack message says "UNASSIGNED — set an owner in harvey.yaml".
  owners:
    legal: ""
    privacy: ""
    billing_fraud: ""
    viral_negative: ""    # urgent negative post about WellPeps

notify:
  # Name of the env var that holds the Slack webhook URL (never the URL).
  # Escalation pages (#pulse-alerts) carry a link + category only, never post text.
  slack_webhook_env: SLACK_WEBHOOK_URL
  # Env var for the briefs webhook (#pulse-briefs); unset = use the one above.
  slack_briefs_webhook_env: SLACK_BRIEFS_WEBHOOK_URL
  # Optional dashboard base URL, linked from Slack pages.
  dashboard_url: ""

dashboard:
  # Set true when the dashboard is served over HTTPS (required for any
  # non-loopback deployment): the session cookie gets the Secure flag.
  secure_cookies: false
  session_hours: 12       # idle session lifetime (sliding)

review:
  # Re-run the adversarial reviewer (one Claude call) after each human edit.
  # The deterministic compliance filter always re-runs.
  rerun_reviewer_on_edit: false
  # Approval requires every cited claim to be signed off in
  # config/claims.yaml ("no claim ID, no publish"). Keep true.
  require_publishable_claims: true

pulse:
  # Market briefs from triaged mentions (aggregates only). Times are local to
  # usage.quiet_hours.timezone; briefs never run in quiet hours or over budget.
  daily_brief_hour: 7     # daily brief (previous local day) after this hour
  weekly_day: monday      # weekly brief (previous Mon-Sun) from this day, after the daily
  top_terms: 25           # emerging terms per brief
  baseline_days: 28       # term velocity is measured against this many prior days
  min_count: 3            # a term needs this many mentions in the window

slack_query:
  # Read-only #pulse-query bot (`pulse slackbot`, Socket Mode). Aggregates
  # only; it never approves, acks or posts. Refused questions don't count.
  daily_limit: 100        # answered questions per local day, all users
  per_user_per_hour: 20   # answered questions per Slack user per rolling hour

# Days to keep mention text before purging (pending legal sign-off).
retention_days: 180
