<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · WellPeps Pulse</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/static/brand/favicon-180.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<div class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <img class="brand-logo" src="/static/brand/wellpeps-logo.png" width="224" height="44" alt="WellPeps">
      <h1><span class="visually-hidden">WellPeps </span>Pulse</h1>
      <p class="tagline">Listen first. Humans approve every reply.</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" id="login-btn" type="submit">Sign in</button>
    <div class="test-result error hidden" id="login-error" role="alert"></div>
    <p class="login-note">Accounts are created by an admin (<code>pulse user add</code>). Sessions end after 12 idle hours.</p>
  </form>
</div>
<script src="/static/login.js"></script>
</body>
</html>
