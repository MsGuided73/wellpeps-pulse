<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · WellPeps Pulse</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/brand/pulse-favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/brand/pulse-favicon-16.png">
<link rel="apple-touch-icon" href="/static/brand/pulse-icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
<main class="login-wrap">
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <img class="brand-logo" src="/static/brand/pulse-icon.png" width="64" height="64" alt="">
      <h1><span class="visually-hidden">WellPeps </span>Pulse</h1>
      <p class="tagline muted">Listen first. People approve every reply.</p>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" id="login-btn" type="submit">Sign in</button>
    <div class="test-result error hidden" id="login-error" role="alert"></div>
    <p class="login-note">Accounts are created by an admin (<code>pulse user add</code>). Sessions end after 12 idle hours.</p>
  </form>
</main>
<footer class="site-foot"><img src="/static/brand/wellpeps-logo.png" width="143" height="28" alt="WellPeps"></footer>
<script src="/static/login.js"></script>
</body>
</html>
