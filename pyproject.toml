[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wellpeps-pulse"
version = "0.3.0"
description = "WellPeps Pulse: social listening with compliant, human-reviewed reply drafting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["social-listening", "telehealth", "compliance", "ai-agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt (used by Docker builds).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    # Dashboard password hashing (argon2id), Phase 7.
    "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.urls]
# Upstream this fork is based on (MIT).
Upstream = "https://github.com/ethanplusai/harvey"

[project.scripts]
harvey = "harvey.cli:main"
pulse = "harvey.cli:main"

[tool.setuptools.packages.find]
include = ["harvey*"]

# The dashboard's HTML/CSS/JS are real files served from disk, and its fonts
# are vendored so a local tool renders correctly with the network off.
[tool.setuptools.package-data]
harvey = ["web/*", "web/fonts/*"]
