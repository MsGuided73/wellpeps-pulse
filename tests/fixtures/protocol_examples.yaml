# Source: WellPeps_AI_Competitor_Mentions_and_Provider_Switching_Protocol_V1
#         (Oct 6, 2026), §12 Training examples 1-25 (fictional training
#         scenarios; brand names test competitor recognition only and assert
#         no facts about those companies). Original:
#         C:\dev\W\docs\community-engagement-agent\WellPeps_AI_Competitor_Mentions_and_Provider_Switching_Protocol_V1.pdf
# Generated: 2026-10-07 for tests/test_protocol_eval.py.
# Do not add internal costs, prices, real people's details or private contacts here.
#
# The protocol says to use these "as training and evaluation cases, not as
# automatically approved copy" (How to use this module). The eval runs the
# deterministic parts of Pulse on each one:
#   inputs    what triage (a model) would supply: category, subtype, subject,
#             the canonical competitor, intent tags, the unmet need and the two
#             0-2 judgement scores; plus the community rule status and whether
#             an earlier post in the thread raised a clinical concern.
#   expected  the protocol's Decision (and, where the protocol gives one or
#             it follows from §9, the opportunity score and band, the brand
#             mode, the escalation route) and the Pulse situation that results.
#   reply     the protocol's suggested reply ("" = None): must pass the
#             compliance filter with no red hit.
#   do_not_say the protocol's "Do not say" line: must be red (kind reply), or
#             is an operator action Pulse can't take at all (kind action).
# Scores for the examples the protocol doesn't score are this file's reading
# of §9 (need_clarity / useful_contribution are the model's judgement).
#   pulse_escalation  (only where it differs from route) the escalation Pulse
#             opens. Only WellPeps' own incidents page an owner; a serious
#             health report about another provider goes on the never-paged
#             safety watch, anything else about other companies is trends only
#             (null). User decision 2026-10-09 (docs/REVISIONS-LOG.md R-13),
#             pending WellPeps clinical confirmation.

examples:
  - n: 1
    title: "Ro support and alternatives"
    post: "I'm sick of Ro. They don't answer my questions. Anyone have a provider they like?"
    inputs: {category: question, subtype: clinic_recommendation, subject_type: competitor, competitor: Ro,
             intents: [alternatives_requested, venting_only], unmet_need: provider_access,
             need_clarity: 2, useful_contribution: 2, participation: allowed}
    expected: {decision: appropriate_alternative, score: 7, band: high, brand_mode: brief_factual_option,
               route: "", situation: protocol_appropriate_alternative}
    reply: "I work with WellPeps. When comparing providers, ask how you can contact your care team and how follow-up works. WellPeps uses licensed providers to review health information, and ongoing support is part of the process if treatment is prescribed. I can explain the process if that would help."
    do_not_say: "We hear that about Ro all the time. We have better support."
    do_not_say_kind: reply

