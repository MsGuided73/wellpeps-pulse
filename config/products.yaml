# PUBLIC-FACING FIELDS ONLY. Do not add internal costs: no per-unit prices WellPeps
# pays, no pharmacy / partner names, no pricing-workbook columns. If a value is not
# shown on wellpeps.com, it does not belong here.
#
# Brand-name equivalents are for MATCHING consumer posts only. WellPeps products
# are not the branded drugs, and replies must never imply they are (R15, R16).
# site_price = the one monthly price on wellpeps.com today (see pricing:). Pulse never
# quotes these: prices in replies come only from approved claims.
# status: live | coming_soon | waitlist
# keywords (categories): plain words that point a post at the program (drafter
# program-status claims).
# aliases: {term, inferred}. inferred: true = consumer slang / misspelling that
# does not appear in any WellPeps source file.

# No membership fee (owner, 2026-10-21): each treatment has one monthly price. Say "one monthly
# price", never "all-inclusive" or "everything included" (labs are extra; filter rule R49).
pricing:
  model: one_monthly_price
  summary: "One monthly price per treatment. No membership fee."
  includes: [the provider visit, ongoing support through the patient portal, the medication if prescribed, shipping]
  not_included: ["lab tests: optional for most treatments, required only for hormone therapy; offered at low cost"]

