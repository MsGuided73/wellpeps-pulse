# Source: C:\dev\W\wellpeps-site\src\data\ebooks.ts (EBOOKS: slug, title,
#         subtitle, program, pages, `inside` = the four chapter highlights) and
#         src\data\guide-pages.ts (GUIDE_PAGES[slug].inside: the landing page's
#         "inside the guide" list, incl. LAST_POINT "The questions every Smart
#         Patient should know to ask"; the series intro).
# Generated: 2026-10-07 for "every answering reply points to the relevant
#            Smart Patient's Guide" (binding user instruction, 2026-10-07).
# Do not add internal costs, prices or anything not printed in those files.
#
# The Smart Patient's Guides catalog. harvey/guides.py picks, per mention, the
# single most relevant guide (program / product / drug / post words) and the
# chapter(s) that answer THIS poster's question; the drafter must say how that
# guide helps, naming the chapter. Chapter titles are verbatim (typographic
# quotes and apostrophes normalised to ASCII, like claims.yaml).
#
# Fields:
#   slug, title (full printed title), short (how a reply names it), subtitle,
#   claim_id (claims.yaml: the approved guide claim a draft cites),
#   link_id (links.yaml), programs (products.yaml categories; [] = series index),
#   pages, keywords (post words that point to this guide besides its programs),
#   prefer_keywords (post words that make this guide win over another guide of
#   the same program, e.g. NAD+), chapters (ebooks.ts `inside`, in order),
#   landing (guide-pages.ts `inside`, the extra topics the landing page lists),
#   default_chapter (used when no chapter matches the question).
# Each chapter / landing topic: title (verbatim), keywords (post words),
#   subtypes (triage subtypes it answers), needs (protocol unmet needs).
# Matching is whole-word and case-insensitive; deterministic.

