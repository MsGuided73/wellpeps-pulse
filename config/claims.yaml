# Generated: 2026-09-27 for WellPeps Pulse Phase 2.
# Approved Claims Library SEED. Do not add internal costs, prices WellPeps pays,
# or partner pharmacy names.
#
# EVERY CLAIM NEEDS COMPLIANCE AND PHYSICIAN SIGN-OFF before it can be published.
# Claims with approved_by: PENDING are usable only in drafts and are NEVER
# publishable ("no claim ID, no publish"). To approve, a named compliance owner
# sets approved_by, approved_at (YYYY-MM-DD) and, if time-limited, expires.
# Do not invent new claim wording here; add only wording from approved material.
#
# Fields: id, text, products (product names from products.yaml, or ["*"]),
# tier (green|yellow per R10), approved_by, approved_at, expires, source, and
# optional link_id (an id from config/links.yaml: the one link a draft citing
# this claim may carry). Since 2026-10-06 also: guide (verbatim from the
# Approved Messaging & Response Guide), finalize / finalize_missing /
# finalize_key (the guide marks something this wording needs as FINALIZE),
# influencer_only (Brand Ambassador / partner wording; never offered to the
# drafter), promotional (counts toward the 20 of the 80/20 rule) and note.
#
# Guide-sourced claims (ids CLM-AMG-<section>-<slug>): wording copied verbatim
# (typographic quotes and apostrophes normalised to ASCII) from
#   C:\dev\W\docs\community-engagement-agent\Community Engagement-20261007T043724Z-1-001.zip
#   -> "Community Engagement/WellPeps_Approved_Messaging_and_Response_Guide.docx"
# The guide is WellPeps' approved messaging, so those claims carry
# approved_by "Approved Messaging & Response Guide v1.0 (Aug 2026)" and are
# publishable while claims_policy.trust_approved_messaging_guide is true.
# Set it to false to make every guide-sourced claim pending again. A claim
# with a bracketed slot ("[approved link]") or an open FINALIZE item is never
# publishable (finalize: true); finalize_key names the item in
# config/engagement_guide.yaml whose value resolves it. See
# docs/RULES-OF-ENGAGEMENT.md.

