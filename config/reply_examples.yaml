# Source: conversion reply playbook brief (2026-10-06), rewritten 2026-10-07 to
#         conform to WellPeps' Community Engagement guidelines and the Competitor
#         Mentions and Provider Switching Protocol (docs/RULES-OF-ENGAGEMENT.md);
#         claims from config/claims.yaml, links from config/links.yaml.
# Generated: 2026-10-06 for the conversion reply playbook; revised 2026-10-07;
#            voice and disclosure placement revised 2026-10-15.
# Do not add internal costs, prices, real people's posts or handles here.
#
# Few-shot STYLE GUIDANCE for the drafter (prompts/draft.md). These are not
# approved replies and are never posted as written: status stays PENDING
# until compliance signs them off, and every real draft still goes through the
# compliance filter, the adversarial reviewer and a human.
#
# Voice and disclosure placement (owner decision 2026-10-15: "There is no
# requirement that it be first. It just needs to be obvious. I want the
# messages to sound more familiar."): each reply opens by responding to the
# person (a short, specific reaction, never canned empathy), discloses in
# sentence 1 or 2 ("I work with WellPeps" or "I'm part of the WellPeps team",
# woven into a sentence or on its own; Guide §4, Protocol §7 only ask that it
# be easy to notice), then answers, then one next step. Contractions, plain
# words, no stock closing line. The provider-boundary line appears only where
# treatment choice is the question (EX-NO-LINK-COMMUNITY), worked into the
# answer. The compliance filter requires the disclosure within the first two
# sentences and before any other WellPeps mention.
#
# What changed earlier (superseded playbook, see RULES-OF-ENGAGEMENT.md
# "Superseded earlier rules"): the disclosure uses the guide's primary form
# (Guide §4; Protocol §7); a WellPeps fact appears only when the person asks
# about WellPeps or explicitly asks for alternatives (Protocol §1, §7;
# Operations Manual §12.2), never "one monthly price" (Live Reference §6
# needs verification); a resource only when it directly answers the question,
# offered as free (Protocol §8; Pre-LegitScript strategy "Not every
# comment gets a link"); 40-90 words (Protocol §7).
# tests/test_reply_playbook.py checks each reply passes compliance_filter
# (only "link not live yet" and the guide's FINALIZE / medication-name review
# notes may show). In the prompt, registry URLs are shown as <guide link>.
#
# Answer first (2026-10-07; Approved Messaging & Response Guide §1-§3): the
# sentence after the disclosure answers the poster's actual question in their
# terms ("Not live yet: ...", "it varies by provider, so ..."); boundary /
# disclaimer wording only where the question needs it, never as the opener;
# one useful next step.

# Smart Patient's Guide (binding user instruction 2026-10-07: "We must refer to a
# relevant guide and point to how the guide can help"): every answering reply
# ends its answer with ONE sentence naming the most relevant guide and the
# chapter (config/guides.yaml) that helps with THIS question, says it is free
# (Derek Goldberg's wording, owner decision 2026-10-20: "Here's a link to get a
# free copy if you'd like"), then carries the tracked link where links are allowed
# (EX-NO-LINK-COMMUNITY: named without a link). Up to ~110 words with it.

status: PENDING
usage: style guidance only

examples:
  - id: EX-PURCHASE-FOLLOWUP
    category: purchase_intent
    platform: reddit
    program: Weight Loss
    post: "anyone tried compounded tirzepatide via telehealth? Trying to figure out which providers include the follow-up visits in the price."
    reply: "Follow-up visits are exactly the thing to pin down before you pay for anything. I work with WellPeps, so I'm biased, but it varies by provider: ask each one what follow-up with a licensed clinician is included and how dose adjustments are handled. Our free GLP-1 Weight Loss guide has a section, \"What's actually included in the price\", that walks through what to check. Here's a link to get a free copy if you'd like: https://wellpeps.com/smart-patient-guides/glp-1-weight-loss"
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-GLP-1-WEIGHT-LOSS]

  - id: EX-AVAILABILITY-HAIR
    category: question
    platform: reddit
    program: Hair Restoration
    post: "Thinking about oral minoxidil through a telehealth service. Is WellPeps hair restoration live yet or still a waitlist?"
    reply: "Good thing to check before you plan around it. I work with WellPeps, so I can answer that one. Not live yet: WellPeps' Hair Restoration program is coming soon and isn't open yet; there's a list you can join to hear when assessments open. Since you're weighing an oral option, our free Hair Restoration guide has a section, \"Oral vs. topical: what actually changes?\", that explains the differences. Here's a link to get a free copy if you'd like: https://wellpeps.com/smart-patient-guides/hair-restoration"
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-STATUS-HAIR, CLM-EDU-GUIDE-HAIR-RESTORATION]

  - id: EX-QUESTION-ONLINE-CLINIC
    category: question
    platform: reddit
    program: Sexual Wellness
    post: "How do you tell if an online ED clinic is legit? So many ads lately."
    reply: "Ha, the ads really are everywhere. I'm part of the WellPeps team, so I'm biased, but I'd check whether you're actually reviewed by a licensed clinician, what follow-up is included, and which pharmacy dispenses the medication. For sorting through the ads, our free Sexual Wellness guide closes with \"The questions every Smart Patient should know to ask\", a list you can take to any clinic. Here's a link to get a free copy if you'd like: https://wellpeps.com/smart-patient-guides/sexual-wellness"
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-SEXUAL-WELLNESS]

  - id: EX-QUESTION-WHAT-TO-ASK
    category: question
    platform: facebook
    program: Healthy Aging & Vitality
    post: "Thinking about peptide therapy through an online clinic. What should I ask first?"
    reply: "Asking before you sign up is the right order. Full disclosure, I work with WellPeps, but this holds for any clinic: find out whether you're actually reviewed by a licensed clinician, what follow-up is included, and which pharmacy dispenses the medication. Our free Healthy Aging & Vitality guide has a chapter, \"Where do wellness therapies fit?\", that helps you frame those questions (it's free, it just needs your email): https://wellpeps.com/smart-patient-guides/healthy-aging-vitality"
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-HEALTHY-AGING-VITALITY]

  - id: EX-NO-LINK-COMMUNITY
    category: question
    platform: facebook
    program: Weight Loss
    post: "Is the oral GLP-1 as good as the shots? Group rules say no links please."
    reply: "Totally fair question, and no links, got it. I work with WellPeps, so I'm biased, but in general how a form compares depends on the person, and a licensed healthcare provider determines whether treatment is appropriate. If it helps, our free GLP-1 Weight Loss guide on the WellPeps website has a chapter, \"Injections, oral tablets and additives\", that explains the differences in plain terms (it's free, it just asks for an email)."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-EDU-GUIDE-GLP-1-WEIGHT-LOSS, CLM-R22-PROVIDER-DETERMINES]
