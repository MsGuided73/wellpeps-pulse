# Source: conversion reply playbook brief (2026-10-06), rewritten 2026-10-07 to
#         conform to WellPeps' Community Engagement guidelines and the Competitor
#         Mentions and Provider Switching Protocol (docs/RULES-OF-ENGAGEMENT.md);
#         claims from config/claims.yaml, links from config/links.yaml.
# Generated: 2026-10-06 for the conversion reply playbook; revised 2026-10-07.
# Do not add internal costs, prices, real people's posts or handles here.
#
# Few-shot STYLE GUIDANCE for the drafter (prompts/draft.md). These are not
# approved replies and are never posted as written: status stays PENDING
# until compliance signs them off, and every real draft still goes through the
# compliance filter, the adversarial reviewer and a human.
#
# What changed (superseded playbook, see RULES-OF-ENGAGEMENT.md "Superseded
# earlier rules"): the disclosure is the guide's primary form "I work with
# WellPeps." (Guide §4; Protocol §7); a WellPeps fact appears only when the
# person asks about WellPeps or explicitly asks for alternatives (Protocol §1,
# §7; Operations Manual §12.2), never "one monthly price" (Live Reference §6
# needs verification); a resource only when it directly answers the question,
# with its email gate stated (Protocol §8; Pre-LegitScript strategy "Not every
# comment gets a link"); 40-90 words (Protocol §7).
# tests/test_reply_playbook.py checks each reply passes compliance_filter
# (only "link not live yet" and the guide's FINALIZE / medication-name review
# notes may show). In the prompt, registry URLs are shown as <guide link>.
#
# Answer first (2026-10-07; Approved Messaging & Response Guide §1-§3): after
# the disclosure the next sentence answers the poster's actual question in
# their terms ("Not live yet: ...", "It varies by provider, so ...");
# boundary / disclaimer wording only where the question needs it, never as the
# opener; one useful next step.

# Smart Patient's Guide (binding user instruction 2026-10-07: "We must refer to a
# relevant guide and point to how the guide can help"): every answering reply
# ends its answer with ONE sentence naming the most relevant guide and the
# chapter (config/guides.yaml) that helps with THIS question, says it is free
# and asks for an email, then carries the tracked link where links are allowed
# (EX-NO-LINK-COMMUNITY: named without a link). Up to ~110 words with it.

status: PENDING
usage: style guidance only

examples:
  - id: EX-PURCHASE-FOLLOWUP
    category: purchase_intent
    platform: reddit
    program: Weight Loss
    post: "anyone tried compounded tirzepatide via telehealth? Trying to figure out which providers include the follow-up visits in the price."
    reply: "I work with WellPeps. It varies by provider, so ask each one exactly what follow-up with a licensed clinician is included and how dose adjustments are handled. Since you're comparing what's included, our free GLP-1 Weight Loss guide (it asks for your email) has a chapter, \"What's actually included in the price\", that walks through what to check before you choose: https://wellpeps.com/smart-patient-guides/glp-1-weight-loss. A licensed healthcare provider determines whether treatment is appropriate."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-GLP-1-WEIGHT-LOSS, CLM-R22-PROVIDER-DETERMINES]

  - id: EX-AVAILABILITY-HAIR
    category: question
    platform: reddit
    program: Hair Restoration
    post: "Thinking about oral minoxidil through a telehealth service. Is WellPeps hair restoration live yet or still a waitlist?"
    reply: "I work with WellPeps. Not live yet: WellPeps' Hair Restoration program is coming soon and isn't open yet; there's a list you can join to hear when assessments open. Since you're weighing an oral option, our free Hair Restoration guide (it asks for your email) has a chapter, \"Oral vs. topical: what actually changes?\", plus the questions to ask before choosing a program: https://wellpeps.com/smart-patient-guides/hair-restoration. A licensed healthcare provider determines whether treatment is appropriate."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-STATUS-HAIR, CLM-EDU-GUIDE-HAIR-RESTORATION, CLM-R22-PROVIDER-DETERMINES]

  - id: EX-QUESTION-ONLINE-CLINIC
    category: question
    platform: reddit
    program: Sexual Wellness
    post: "How do you tell if an online ED clinic is legit? So many ads lately."
    reply: "I work with WellPeps. A few things worth checking with any online clinic are whether you are actually reviewed by a licensed clinician, what follow-up is included, and which pharmacy dispenses the medication. For sorting through the ads, our free Sexual Wellness guide (it asks for your email) closes with \"The questions every Smart Patient should know to ask\", a list you can take to any clinic: https://wellpeps.com/smart-patient-guides/sexual-wellness. A licensed healthcare provider determines whether treatment is appropriate."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-SEXUAL-WELLNESS, CLM-R22-PROVIDER-DETERMINES]

  - id: EX-QUESTION-WHAT-TO-ASK
    category: question
    platform: facebook
    program: Healthy Aging & Vitality
    post: "Thinking about peptide therapy through an online clinic. What should I ask first?"
    reply: "I work with WellPeps. Good things to ask up front: whether you are actually reviewed by a licensed clinician, what follow-up is included, and which pharmacy dispenses the medication. Before you ask, our free Healthy Aging & Vitality guide (it asks for your email) has a chapter, \"Where do wellness therapies fit?\", that helps you frame those questions: https://wellpeps.com/smart-patient-guides/healthy-aging-vitality. A licensed healthcare provider determines whether treatment is appropriate."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-R7-PROVIDER-CHECKLIST, CLM-EDU-GUIDE-HEALTHY-AGING-VITALITY, CLM-R22-PROVIDER-DETERMINES]

  - id: EX-NO-LINK-COMMUNITY
    category: question
    platform: facebook
    program: Weight Loss
    post: "Is the oral GLP-1 as good as the shots? Group rules say no links please."
    reply: "I work with WellPeps. In general, how a form compares depends on the person, and a licensed clinician is the one to weigh that with you. If it helps, our free GLP-1 Weight Loss guide on the WellPeps website (it asks for your email) has a chapter, \"Injections, oral tablets and additives\", that explains the differences in plain terms. A licensed healthcare provider determines whether treatment is appropriate."
    claim_ids: [CLM-AMG-04-WORK-WITH, CLM-EDU-GUIDE-GLP-1-WEIGHT-LOSS, CLM-R22-PROVIDER-DETERMINES]
