    claim_ids: [CLM-R3-DISCLOSURE, CLM-R7-PROVIDER-CHECKLIST, CLM-PRICE-FOLLOWUP, CLM-EDU-GUIDE-SEXUAL-WELLNESS, CLM-R22-PROVIDER-DETERMINES]

